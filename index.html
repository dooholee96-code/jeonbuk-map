<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전북 학교지도 — 농촌유학·특수교육·유치원</title>
<meta name="description" content="전북특별자치도 14개 시군의 유치원·초·중·고·특수학교를 농촌유학·특수교육·유치원 세 가지 지도로 봅니다.">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header>
  <div class="head-top">
    <div class="brand">
      <h1><span class="t-wide">전북 학교 통합지도</span><span class="t-narrow">전북 학교지도</span></h1>
      <span class="sub" id="headSub">14개 시군 초·중·고와 농촌유학 운영·희망학교</span>
    </div>
    <div class="head-tools">
      <label class="lblsel"><span>배경</span>
        <select id="tileSel"></select>
      </label>
      <label class="lblsel"><span>라벨</span>
        <select id="labelMode">
          <option value="auto">자동</option>
          <option value="all">전체</option>
          <option value="key" id="labelKey">농촌유학만</option>
          <option value="none">숨기기</option>
        </select>
      </label>
      <button class="btn" id="btnFit">지역 맞춤</button>
    </div>
  </div>
  <div id="editBar" hidden>
    <span class="eb-tag">편집 중</span>
    <span id="editCount">변경 없음</span>
    <span class="eb-spacer"></span>
    <button class="btn small" data-act="add">+ 학교 추가</button>
    <button class="btn small primary" data-act="export">내보내기</button>
    <button class="btn small" data-act="discard">되돌리기</button>
    <button class="btn small" data-act="off">편집 끝</button>
  </div>
</header>

<div id="shell">
  <aside id="panel">
    <button class="sheet-handle" id="sheetHandle" aria-label="목록 크기 조절"><span></span></button>

    <div class="panel-head">
      <h2 class="panel-title" id="panelTitle"><span class="pin" aria-hidden="true"></span>학교·농촌유학 지도</h2>

      <div class="selects">
        <select id="mapSel" class="map-sel" aria-label="지도 종류 선택"></select>
        <select id="regionSel" aria-label="지역 선택"></select>
        <select id="typeSel" aria-label="형태 선택"></select>
      </div>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="학교명 또는 주소 검색" autocomplete="off">
      </div>
    </div>

    <div id="summary"></div>
    <div id="list"></div>
  </aside>

  <div id="mapWrap">
    <div id="map"></div>

    <button id="panelToggle" title="목록 접기/펴기">☰</button>

    <div id="tileWarn" hidden></div>

    <div id="detail"></div>

    <details id="legend" open>
      <summary>범례</summary>
      <div id="legendBody"></div>
    </details>

  </div>
</div>

<div id="modal" hidden></div>

<!-- 지도 라이브러리 (저장소에 동봉 — CDN·API 키 불필요) -->
<script src="assets/vendor/leaflet/leaflet.js"></script>

<!-- 데이터 (외부 요청 없이 로컬 파일만으로 동작하도록 .js 로 제공) -->
<script src="assets/js/config.js"></script>
<script src="assets/data/boundaries.js"></script>
<script src="assets/data/eupmyeon.js"></script>

<script src="data/regions/jinan.js"></script>
<script src="data/regions/imsil.js"></script>
<script src="data/regions/jeongeup.js"></script>
<script src="data/regions/sunchang.js"></script>
<script src="data/regions/namwon.js"></script>
<script src="data/regions/jangsu.js"></script>
<script src="data/regions/muju.js"></script>
<script src="data/regions/gochang.js"></script>
<script src="data/regions/buan.js"></script>
<script src="data/regions/wanju.js"></script>
<script src="data/regions/gimje.js"></script>
<script src="data/regions/jeongju.js"></script>
<script src="data/regions/iksan.js"></script>
<script src="data/regions/gunsan.js"></script>

<!-- 유치원 -->
<script src="data/kinder/jinan.js"></script>
<script src="data/kinder/imsil.js"></script>
<script src="data/kinder/jeongeup.js"></script>
<script src="data/kinder/sunchang.js"></script>
<script src="data/kinder/namwon.js"></script>
<script src="data/kinder/jangsu.js"></script>
<script src="data/kinder/muju.js"></script>
<script src="data/kinder/gochang.js"></script>
<script src="data/kinder/buan.js"></script>
<script src="data/kinder/wanju.js"></script>
<script src="data/kinder/gimje.js"></script>
<script src="data/kinder/jeongju.js"></script>
<script src="data/kinder/iksan.js"></script>
<script src="data/kinder/gunsan.js"></script>

<!-- 특수학교 -->
<script src="data/special/jeongeup.js"></script>
<script src="data/special/namwon.js"></script>
<script src="data/special/jangsu.js"></script>

<script src="data/special/jeongju.js"></script>
<script src="data/special/iksan.js"></script>
<script src="data/special/gunsan.js"></script>

<script src="assets/js/labels.js"></script>
<script src="assets/js/edit.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
